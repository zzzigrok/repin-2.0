<svg viewBox="0 0 1100 620" xmlns="http://www.w3.org/2000/svg"
    style="background-color: #0f111a; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <style>
        :root {
            --gen-color: #00e676;
            --gen-bg: rgba(0, 230, 118, 0.05);
            --gen-box-bg: rgba(0, 230, 118, 0.15);
            
            --disc-color: #ff1744;
            --disc-bg: rgba(255, 23, 68, 0.05);
            --disc-box-bg: rgba(255, 23, 68, 0.15);
            
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --line-color: #475569;
        }

        @keyframes dashFlow {
            from { stroke-dashoffset: 24; }
            to { stroke-dashoffset: 0; }
        }

        @keyframes dashFlowReverse {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: 24; }
        }

        .animated-line {
            animation: dashFlow 1.2s linear infinite;
        }

        .animated-line-reverse {
            animation: dashFlowReverse 1.8s linear infinite;
        }

        .layer-box-gen, .layer-box-disc {
            transition: all 0.3s ease;
        }
        
        .layer-box-gen:hover {
            fill: rgba(0, 230, 118, 0.25);
            stroke-width: 2.5;
            filter: drop-shadow(0 0 12px rgba(0, 230, 118, 0.5));
        }

        .layer-box-disc:hover {
            fill: rgba(255, 23, 68, 0.25);
            stroke-width: 2.5;
            filter: drop-shadow(0 0 12px rgba(255, 23, 68, 0.5));
        }

        .title { font-size: 24px; font-weight: 600; fill: var(--text-main); }
        .layer-text { font-size: 16px; font-weight: 500; fill: var(--text-main); }
        .label-text { font-size: 14px; fill: var(--text-sub); }
        .math-text { font-family: 'Cambria Math', 'Times New Roman', serif; font-style: italic; }
        .loss-text { font-size: 15px; font-weight: 600; fill: #94a3b8; letter-spacing: 1px; }
    </style>

    <defs>
        <linearGradient id="gradGen" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0f291e" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#08140f" stop-opacity="0.8" />
        </linearGradient>

        <linearGradient id="gradDisc" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2b0f15" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#14070a" stop-opacity="0.8" />
        </linearGradient>

        <filter id="glowGen" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="glowDisc" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="glowLoss" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <rect width="1100" height="620" fill="#0f111a" />

    <rect x="40" y="60" width="440" height="460" rx="20" fill="url(#gradGen)"
        stroke="var(--gen-color)" stroke-width="2" stroke-opacity="0.4" />
    <text x="260" y="100" class="title" text-anchor="middle">Генератор (G)</text>

    <rect x="620" y="60" width="440" height="460" rx="20" fill="url(#gradDisc)"
        stroke="var(--disc-color)" stroke-width="2" stroke-opacity="0.4" />
    <text x="840" y="100" class="title" text-anchor="middle">Дискриминатор (D)</text>

    <path d="M 260 160 L 260 205" stroke="var(--line-color)" stroke-width="2" stroke-dasharray="6,6"
        class="animated-line" />
    <path d="M 260 255 L 260 285" stroke="var(--line-color)" stroke-width="2" />
    <path d="M 260 335 L 260 365" stroke="var(--line-color)" stroke-width="2" />

    <path d="M 840 160 L 840 205" stroke="var(--line-color)" stroke-width="2" stroke-dasharray="6,6"
        class="animated-line" />
    <path d="M 840 255 L 840 285" stroke="var(--line-color)" stroke-width="2" />
    <path d="M 840 335 L 840 365" stroke="var(--line-color)" stroke-width="2" />

    <path id="pathRealToD" d="M 550 60 C 550 100, 600 140, 660 140" fill="none"
        stroke="var(--line-color)" stroke-width="2" stroke-dasharray="6,6" class="animated-line" />

    <path id="pathFakeToD" d="M 440 390 C 580 390, 520 140, 660 140" fill="none"
        stroke="var(--line-color)" stroke-width="2" stroke-dasharray="6,6" class="animated-line" />

    <path id="pathBackprop"
        d="M 840 415 L 840 540 Q 840 560 820 560 L 280 560 Q 260 560 260 540 L 260 415" fill="none"
        stroke="var(--line-color)" stroke-width="2" stroke-dasharray="8,8"
        class="animated-line-reverse" />

    <rect x="80" y="120" width="360" height="40" fill="transparent" stroke="var(--line-color)"
        stroke-width="2" stroke-dasharray="6,6" />
    <text x="260" y="145" class="layer-text" text-anchor="middle">Шум <tspan class="math-text">z</tspan>
        ∈ ℝ⁶⁴</text>

    <rect x="80" y="205" width="360" height="50" fill="var(--gen-box-bg)" stroke="var(--gen-color)"
        stroke-width="1.5" class="layer-box-gen" />
    <text x="260" y="235" class="layer-text" text-anchor="middle">Linear (64 → 256) + ReLU</text>

    <rect x="80" y="285" width="360" height="50" fill="var(--gen-box-bg)" stroke="var(--gen-color)"
        stroke-width="1.5" class="layer-box-gen" />
    <text x="260" y="315" class="layer-text" text-anchor="middle">Linear (256 → 512) + ReLU</text>

    <rect x="80" y="365" width="360" height="50" fill="var(--gen-box-bg)" stroke="var(--gen-color)"
        stroke-width="1.5" class="layer-box-gen" />
    <text x="260" y="395" class="layer-text" text-anchor="middle">Linear (512 → 784) + Tanh</text>

    <rect x="660" y="120" width="360" height="40" fill="transparent" stroke="var(--line-color)"
        stroke-width="2" stroke-dasharray="6,6" />
    <text x="840" y="145" class="layer-text" text-anchor="middle">Вход <tspan class="math-text">x</tspan>
        ∈ ℝ⁷⁸⁴</text>

    <rect x="660" y="205" width="360" height="50" fill="var(--disc-box-bg)"
        stroke="var(--disc-color)" stroke-width="1.5" class="layer-box-disc" />
    <text x="840" y="235" class="layer-text" text-anchor="middle">Linear (784 → 512) + LeakyReLU</text>

    <rect x="660" y="285" width="360" height="50" fill="var(--disc-box-bg)"
        stroke="var(--disc-color)" stroke-width="1.5" class="layer-box-disc" />
    <text x="840" y="315" class="layer-text" text-anchor="middle">Linear (512 → 256) + LeakyReLU</text>

    <rect x="660" y="365" width="360" height="50" fill="var(--disc-box-bg)"
        stroke="var(--disc-color)" stroke-width="1.5" class="layer-box-disc" />
    <text x="840" y="395" class="layer-text" text-anchor="middle">Linear (256 → 1) + Sigmoid</text>

    <rect x="490" y="20" width="120" height="40" rx="4" fill="transparent"
        stroke="var(--line-color)" stroke-width="2" stroke-dasharray="4,4" />
    <text x="550" y="45" class="label-text" text-anchor="middle" font-weight="600" fill="#cbd5e1">Real
        Image</text>

    <rect x="500" y="270" width="100" height="30" rx="15" fill="#0f111a" fill-opacity="0.8" />
    <text x="550" y="290" class="label-text" text-anchor="middle" fill="#00e676" font-weight="600">Fake
        Image</text>

    <rect x="430" y="545" width="240" height="30" fill="#0f111a" fill-opacity="0.9" />
    <text x="550" y="565" class="loss-text" text-anchor="middle">BCELoss &amp; Backpropagation</text>

    <circle r="4.5" fill="#60a5fa" filter="url(#glowDisc)">
        <animateMotion dur="2.5s" repeatCount="indefinite" calcMode="linear">
            <mpath href="#pathRealToD" />
        </animateMotion>
    </circle>

    <circle r="4.5" fill="#00e676" filter="url(#glowGen)">
        <animateMotion dur="3.5s" repeatCount="indefinite" calcMode="linear">
            <mpath href="#pathFakeToD" />
        </animateMotion>
    </circle>

    <circle r="4.5" fill="#f59e0b" filter="url(#glowLoss)">
        <animateMotion dur="4.5s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear">
            <mpath href="#pathBackprop" />
        </animateMotion>
    </circle>

    <circle r="4.5" fill="#f59e0b" filter="url(#glowLoss)">
        <animateMotion dur="4.5s" begin="2.25s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear">
            <mpath href="#pathBackprop" />
        </animateMotion>
    </circle>
</svg>